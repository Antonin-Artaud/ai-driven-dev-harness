# Type check configuration (CI: azure-pipelines.yml). mypy needs Python >= 3.10 to run;
# Python 3.9 compatibility is checked by the unit tests on Python 3.9.
[mypy]
python_version = 3.10
mypy_path = scripts/hooks
ignore_missing_imports = True
warn_unused_ignores = True
check_untyped_defs = True
explicit_package_bases = True
