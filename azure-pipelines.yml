# Runs the plugin test suite (hooks, onboarding script, plugin structure) on every push to main
# and on pull requests, plus a quality job: ruff (lint and format), mypy, and a coverage report of
# the scripts with a minimum threshold. Azure Repos ignores the `pr` key: add this pipeline as a build validation
# policy on main to run it on pull requests.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

jobs:
  - job: tests
    displayName: Tests
    strategy:
      matrix:
        linux_python39:
          imageName: ubuntu-latest
          pythonVersion: '3.9'
        linux_python312:
          imageName: ubuntu-latest
          pythonVersion: '3.12'
        windows_python312:
          imageName: windows-latest
          pythonVersion: '3.12'
        macos_python312:
          imageName: macOS-latest
          pythonVersion: '3.12'
    pool:
      vmImage: $(imageName)
    steps:
      - checkout: self
        fetchDepth: 1

      - task: UsePythonVersion@0
        displayName: Use Python $(pythonVersion)
        inputs:
          versionSpec: $(pythonVersion)

      - script: |
          python --version
          git --version
        displayName: Show tool versions

      - script: python -m unittest -v
        displayName: Run unit tests
        workingDirectory: tests

  - job: quality
    displayName: Lint, types and coverage
    pool:
      vmImage: ubuntu-latest
    variables:
      COVERAGE_PROCESS_START: $(Build.SourcesDirectory)/.coveragerc
      PYTHONPATH: $(Build.SourcesDirectory)/tests
    steps:
      - checkout: self
        fetchDepth: 1

      - task: UsePythonVersion@0
        displayName: Use Python 3.12
        inputs:
          versionSpec: '3.12'

      # CI-only tools: the plugin itself stays standard library only (ADR 0003).
      - script: python -m pip install --disable-pip-version-check "ruff>=0.6" "mypy>=1.11" "coverage>=7.4"
        displayName: Install ruff, mypy and coverage

      - script: |
          ruff check .
          ruff format --check .
        displayName: Ruff (ruff.toml)

      - script: mypy scripts/hooks scripts/close_workflow.py scripts/usage_report.py skills/project-onboarding/scripts/onboard.py
        displayName: Mypy (mypy.ini)

      # Hooks run as subprocesses are measured through tests/sitecustomize.py.
      - script: |
          python -m coverage run -m unittest discover -s tests -t tests
          python -m coverage combine
          python -m coverage report --fail-under=80
          python -m coverage xml -o coverage.xml
        displayName: Tests with coverage (minimum 80%)

      - task: PublishCodeCoverageResults@2
        displayName: Publish coverage
        condition: succeededOrFailed()
        inputs:
          summaryFileLocation: coverage.xml
